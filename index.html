<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid ile Hizalama Çalışması</title>
</head>
<body>
    <style>
        .hiza { display: grid; grid-template-columns: 120px 120px; grid-auto-rows: 60px gap: 6px;}
    </style>
    <div class="hiza kap" style="justify-items: start; align-items: center;">
        <div class="k">items</div> <div class="k">hücre</div>
    </div>
    </div>
        <div class="hiza kap" style="justify-content: center; margin-top: 6px">
        <div class="k">content</div><div class="k">kapta ortada</div>
    </div>
</body>
</html>
